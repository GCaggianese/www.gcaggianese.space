---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ site.active_lang }}">
<head>
  {% include head.html %}
  <link rel="stylesheet" href="{{ site.url }}/assets/css/hire-me.css">
</head>
<body class="hire-me-page">
  <header class="header flex" role="banner">
    <div class="container animated fadeIn">
      <div class="row">
        <img src="{{ site.url }}/assets/img/profile.jpeg" alt="Germán Caggianese" class="img-circle animated rotateIn">
        <h3 class="title">
          <p style="font-size:1.2rem;font-weight:300">Germán Caggianese</p>
        </h3>
        <hr class="hr-line">
        <h3 class="title">
          <p style="font-weight:bold;font-size:1.1rem">{{ page.role }}</p>
          <p style="font-size:1rem;font-weight:300">{{ page.subtitle }}</p>
          <a class="btn zoombtn hire-me-primary" href="https://www.upwork.com/freelancers/~016bb2fdeef1cb2886" target="_blank" rel="noopener noreferrer">
            {{ page.upwork_cta }}
          </a>
        </h3>
        <hr class="hr-line">
        <main class="content hire-me-content">
          {{ content }}
        </main>
        <h3 class="title">
          <a class="btn zoombtn hire-me-secondary" href="https://github.com/GCaggianese/self-hosting-platform" target="_blank" rel="noopener noreferrer">
            {{ page.case_cta }}
          </a>
          <a class="btn zoombtn hire-me-primary" href="https://www.upwork.com/freelancers/~016bb2fdeef1cb2886" target="_blank" rel="noopener noreferrer">
            {{ page.upwork_cta }}
          </a>
        </h3>
        {% assign root_url = site.url | remove: '/es' | remove: '/zh_TW' %}
        <div class="language-switcher" style="text-align:right;margin-top:1rem">
          <a {% static_href %}href="{{ root_url }}/hire-me.html"{% endstatic_href %} title="English" class="btn zoombtn lang-btn">
            <img src="{{ site.url }}/assets/img/flags/uk.png" alt="English" style="width:24px;height:auto">
          </a>
          <a {% static_href %}href="{{ root_url }}/es/hire-me.html"{% endstatic_href %} title="Español" class="btn zoombtn lang-btn">
            <img src="{{ site.url }}/assets/img/flags/uy.png" alt="Español" style="width:24px;height:auto">
          </a>
          <a {% static_href %}href="{{ root_url }}/zh_TW/hire-me.html"{% endstatic_href %} title="中文" class="btn zoombtn lang-btn">
            <img src="{{ site.url }}/assets/img/flags/tw.png" alt="中文" style="width:24px;height:auto">
          </a>
        </div>
      </div>
    </div>
  </header>
  {% include scripts.html %}
</body>
</html>
